name: CI

on:
    push:
        branches: [main, master, '*.x', WIP]
    pull_request:

permissions:
    contents: read

jobs:
    # Copy-paste detection runs in the shared Node-only lane, since jscpd is a
    # Node tool.
    cpd:
        uses: magicsunday/.github/.github/workflows/cpd.yml@main
        permissions:
            contents: read

    build:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ['8.4']

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up PHP version ${{ matrix.php }}
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: ${{ matrix.php }}
                  tools: composer:v2

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '22'

            - id: install
              name: Install dependencies
              run: |
                  composer validate
                  composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts
                  npm ci

            - name: Lint
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:php:lint

            - name: CGL
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:php:cgl

            - name: Rector
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:php:rector

            - name: Fractor
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:php:fractor

            - name: PHPStan
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:php:phpstan -- --error-format=github

            - name: Deptrac
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:php:deptrac

            - name: Templates
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:php:templates

            - name: PHPUnit
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: composer ci:test:php:unit

            - name: Build SPA
              if: ${{ always() && steps.install.conclusion == 'success' }}
              run: npm run build
